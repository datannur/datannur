ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/empty-root
    Alias /datannur/ /var/www/html/

    <Directory /var/www/empty-root>
        Require all denied
    </Directory>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
