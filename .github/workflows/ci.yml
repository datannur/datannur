name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    name: Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit signatures
        run: npm audit signatures

      - name: Audit production vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high --json | node -e "
            const ignored = ['GHSA-r5fr-rjxr-66jc', 'GHSA-f23m-r3pf-42rh'];
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const found = Object.values(data.vulnerabilities || {})
              .flatMap(v => v.via).filter(v => typeof v === 'object')
              .filter(v => ignored.every(id => v.url?.includes(id) === false));
            if (found.length) { console.log(JSON.stringify(found, null, 2)); process.exit(1); }
          "

      - name: Check synced dependencies
        run: |
          node -e '
            const fs = require("fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pub = JSON.parse(fs.readFileSync("public/package.json", "utf8"));
            const strip = v => v.replace(/^[\^~]/, "");
            const errors = Object.keys(pub.dependencies || {}).filter(p => {
              const rv = (root.devDependencies || {})[p] || (root.dependencies || {})[p];
              return !rv || strip(rv) !== strip(pub.dependencies[p]);
            });
            if (errors.length) { console.error("Mismatched versions:", errors); process.exit(1); }
            console.log("All shared dependencies are in sync");
          '

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check

      - name: Generate router index
        run: node -e "import('svelte-fileapp/vite').then(m => m.updateRouterIndex('src/page').buildStart())"

      - name: Svelte
        run: npm run svelte-check

      - name: Validate schemas
        run: npm run validate-schemas

  tests:
    runs-on: ubuntu-24.04-arm
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build & Tests
        run: npm run test

      - name: Compute artifact name
        if: failure()
        id: artifact_name
        run: |
          SAFE_REF=${GITHUB_REF_NAME//\//-}
          echo "value=test-artifacts-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
