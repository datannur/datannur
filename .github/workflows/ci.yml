name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    name: Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check

      - name: Svelte
        run: npm run svelte-check

      - name: Validate schemas
        run: npm run validate-schemas

  tests:
    runs-on: ubuntu-24.04-arm
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build & Tests
        run: npm run test

      - name: Compute artifact name
        if: failure()
        id: artifact_name
        run: |
          SAFE_REF=${GITHUB_REF_NAME//\//-}
          echo "value=test-artifacts-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
